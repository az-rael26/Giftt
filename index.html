<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="index.css" rel="stylesheet">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
        <title>Random</title>
    </head>
    <body>
        <div class="background-decor" aria-hidden="true">
            <span class="star" style="--left: 8%; --top: 14%; --delay: -1s; --duration: 4s;">✦</span>
            <span class="star" style="--left: 23%; --top: 68%; --delay: -2s; --duration: 5s;">✧</span>
            <span class="star" style="--left: 37%; --top: 25%; --delay: -3s; --duration: 4.5s;">✦</span>
            <span class="star" style="--left: 55%; --top: 78%; --delay: -1.5s; --duration: 5.5s;">✧</span>
            <span class="star" style="--left: 71%; --top: 18%; --delay: -2.5s; --duration: 4.2s;">✦</span>
            <span class="star" style="--left: 88%; --top: 58%; --delay: -0.5s; --duration: 5s;">✧</span>
            <span class="star" style="--left: 94%; --top: 9%; --delay: -3.5s; --duration: 4.7s;">✦</span>
            <span class="petal" style="--left: 12%; --delay: -8s; --duration: 19s;"></span>
            <span class="petal" style="--left: 29%; --delay: -15s; --duration: 23s;"></span>
            <span class="petal" style="--left: 46%; --delay: -4s; --duration: 18s;"></span>
            <span class="petal" style="--left: 63%; --delay: -12s; --duration: 25s;"></span>
            <span class="petal" style="--left: 79%; --delay: -6s; --duration: 21s;"></span>
            <span class="petal" style="--left: 97%; --delay: -17s; --duration: 24s;"></span>
        </div>
        <div class="envelope-wrapper">
            <div id="envelope" class="close">
                <div class="front flap"></div>
                <div class="front pocket"></div>
                <div class="letter">
                    <p class="words line1">Hi bebii!</p>
                    <p class="words line2">Goodluck po sa midterms mo. Do your best palagii! </p>
                    <p class="words line3">(⁠◍⁠•⁠ᴗ⁠•⁠◍⁠)⁠⁠⁠♡</p>
                    <p class="words line4">Iboniee</p>
                </div>
                <div class="hearts">
                    <div class="heart a1"></div>
                    <div class="heart a2"></div>
                    <div class="heart a3"></div>
                </div>
            </div>
        </div>
        <div class="reset">
            <button id="open" type="button">Open</button>
        </div>
        <h1 class="valentine"></h1>
        <script src="index.js"></script>
    </body>
</html>
